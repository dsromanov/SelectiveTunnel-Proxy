name: macOS build

on:
  push:
    branches: [main, master]
    paths: ["macos/**", "policy/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Build (swift build + .app bundle)
        run: cd macos && bash scripts/build.sh

      - name: Install (daemon + launchd)
        run: cd macos && sudo bash scripts/install.sh

      - name: Verify daemon registered
        run: |
          sudo launchctl print system/com.selectivetunnel.daemon | head -15
          ls -la "/Library/Application Support/SelectiveTunnel/run/"

      - name: Package (полный установочный архив с бинарниками)
        run: |
          PKG="SelectiveTunnel-macOS"
          rm -rf "$PKG" && mkdir -p "$PKG"
          cp -R macos "$PKG/macos"
          rm -rf "$PKG/macos/.build" "$PKG/macos/.swiftpm"
          cp -R policy "$PKG/policy"
          cp "packaging/КАК-УСТАНОВИТЬ.txt" "$PKG/"
          zip -r SelectiveTunnel-macos-arm64.zip "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: SelectiveTunnel-2.0.0-macos-arm64
          path: SelectiveTunnel-macos-arm64.zip
